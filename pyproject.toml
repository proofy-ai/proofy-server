[project]
name = "proofy-server"
version = "0.1.0"
description = "Proofy: 지급정지 이의제기 서류 준비를 돕는 웹앱의 BE와 AI 에이전트 (시연용 프로토타입)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "pillow>=13",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.6",
]
