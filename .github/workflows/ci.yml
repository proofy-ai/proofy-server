name: CI

on:
  # 문서만 바꾼 커밋·PR은 건너뛴다(바뀐 파일이 전부 .md 또는 docs/일 때만)
  pull_request:
    branches: [dev, main]
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성 설치
        run: uv sync --locked
      - name: 린트
        run: uv run ruff check .
      - name: 테스트 (API 키 없이 scripted 모드)
        run: uv run python -m pytest -q
        env:
          AGENT_LLM: scripted
